# 构建 VitePress 站点并部署到 GitHub Pages
name: Deploy VitePress site to Pages

on:
  # 推送到 main 分支时自动构建部署（若默认分支是 master 请改为 master）
  push:
    branches: [main]
  # 支持在 Actions 页面手动触发
  workflow_dispatch:

# 授予 GITHUB_TOKEN 部署 GitHub Pages 所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一个部署任务，但不取消进行中的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 构建任务
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 完整历史，供 lastUpdated 显示每页最后更新时间
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Cache VitePress
        uses: actions/cache@v4
        with:
          path: .vitepress/cache
          key: ${{ runner.os }}-vitepress-${{ hashFiles('.vitepress/**', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vitepress-
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Install dependencies
        run: npm ci
      - name: Build with VitePress
        run: npm run docs:build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  # 部署任务
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4